[package]
name = "file-tidy-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only, no-follow native filesystem primitives for file-tidy"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
