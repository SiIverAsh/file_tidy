[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/cli", "crates/gui/src-tauri"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/SiIverAsh/file_tidy"

[workspace.dependencies]
file-tidy-core = { version = "0.1.0", path = "crates/core" }
file-tidy-platform = { version = "0.1.0", path = "crates/platform" }
walkdir = "2.5.0"
rayon = "1.12.0"
blake3 = "1.8.7"
infer = "0.22.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
tempfile = "3.27.0"
getrandom = "0.4.3"
cap-std = "4.0.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = true

# Inherits release settings while allowing dist to select its own build profile.
[profile.dist]
inherits = "release"
