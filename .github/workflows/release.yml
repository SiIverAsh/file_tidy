name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag containing CLI and GUI (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a version tag such as v0.1.0 or v0.2.0-rc.1' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Record immutable release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate GUI sources and release version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_TAG"][1:]
          versions = {
              "Cargo.toml": tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"],
          }
          for name in ("tauri.conf.json", "package.json", "package-lock.json"):
              path = pathlib.Path("crates/gui") / ("src-tauri" if name == "tauri.conf.json" else "") / name
              if not path.is_file():
                  raise SystemExit("Selected tag has no GUI release sources. Create a new version tag containing the GUI and release configuration.")
              data = json.loads(path.read_text(encoding="utf-8"))
              versions[str(path)] = data["version"]
              if name == "package-lock.json":
                  versions[f"{path} packages[root]"] = data["packages"][""]["version"]
              if name == "tauri.conf.json" and not data.get("bundle", {}).get("active"):
                  raise SystemExit("GUI bundling is disabled in the selected tag. Tag the updated release configuration.")
          for manifest, version in versions.items():
              if version != expected:
                  raise SystemExit(f"{manifest}: version {version!r} does not match tag version {expected!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
          PY

  ci:
    name: Release checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  security:
    name: Release security
    needs: resolve
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  plan:
    name: Plan release
    needs: [resolve, ci, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/setup-dist
      - name: Validate tag and plan artifacts
        id: plan
        run: |
          dist plan --tag "$RELEASE_TAG" --output-format=json > plan.json
          echo "matrix=$(jq -c '.ci.github.artifacts_matrix' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package (${{ join(matrix.targets, ', ') }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/setup-dist
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dist-${{ join(matrix.targets, '-') }}
          save-if: false
      - name: Build archives and checksums
        id: build
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
          BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
        run: |
          # dist supplies a whitespace-separated list of target flags.
          read -r -a args <<< "$DIST_ARGS"
          dist build --tag "$RELEASE_TAG" --output-format=json "${args[@]}" > dist-manifest.json
          {
            echo 'paths<<EOF'
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-local-${{ join(matrix.targets, '-') }}
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/*-dist-manifest.json
          if-no-files-found: error
          retention-days: 7

  gui:
    name: Package GUI (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
    defaults:
      run:
        shell: bash
    env:
      GUI_TARGET: ${{ matrix.target }}
      GUI_BUNDLES: ${{ matrix.bundles }}
      GUI_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: gui-release-${{ matrix.target }}
          save-if: false
      - name: Install Linux Tauri 2 system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install locked GUI build tools
        working-directory: crates/gui
        run: npm ci
      - name: Build GUI installer
        working-directory: crates/gui
        run: npm run tauri -- build --ci --target "$GUI_TARGET" --bundles "$GUI_BUNDLES" -- --locked
      - name: Verify bundled frontend CSP
        working-directory: crates/gui
        run: npm run check:csp
      - name: Collect GUI installer and checksum
        run: |
          python3 scripts/collect_gui_artifacts.py \
            --bundle-dir "target/$GUI_TARGET/release/bundle" \
            --output-dir target/gui-distrib \
            --target "$GUI_TARGET" \
            --version "$GUI_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gui-${{ matrix.target }}
          path: target/gui-distrib/*
          if-no-files-found: error
          retention-days: 7

  installers:
    name: Build installers
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/setup-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-local-*
          path: target/distrib
          merge-multiple: true
      - name: Build installers and release manifest
        id: build
        run: |
          dist build --tag "$RELEASE_TAG" --artifacts=global --output-format=json > dist-manifest.json
          {
            echo 'paths<<EOF'
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-global
          path: |
            ${{ steps.build.outputs.paths }}
            dist-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [ci, security, plan, build, gui, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-local-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-global
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: gui-*
          path: artifacts
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          title=$(jq -r '.announcement_title' artifacts/dist-manifest.json)
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          cat > release-notes.md <<EOF
          ## Desktop GUI installers

          | Platform | Installer |
          | --- | --- |
          | Apple Silicon macOS | [DMG]($base/file-tidy-gui-$version-aarch64-apple-darwin.dmg) |
          | Intel macOS | [DMG]($base/file-tidy-gui-$version-x86_64-apple-darwin.dmg) |
          | Windows x64 | [Setup EXE]($base/file-tidy-gui-$version-x86_64-pc-windows-msvc-setup.exe) |
          | Linux x64 (Ubuntu 22.04+) | [DEB]($base/file-tidy-gui-$version-x86_64-unknown-linux-gnu.deb) |

          Each GUI installer has a matching .sha256 checksum asset. macOS installers use ad-hoc signing and are not Apple-notarized; for a trusted download, use System Settings > Privacy & Security > Open Anyway after the first blocked launch.

          ## Command-line tools

          EOF
          jq -r '.announcement_github_body' artifacts/dist-manifest.json >> release-notes.md
          args=()
          if jq -e '.announcement_is_prerelease' artifacts/dist-manifest.json > /dev/null; then
            args+=(--prerelease)
          fi
          # Internal per-platform manifests are not release assets.
          mapfile -d '' -t assets < <(find artifacts -type f ! -name '*-dist-manifest.json' -print0)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets found' >&2
            exit 1
          fi
          # The tag already identifies the release commit. Passing --target for an
          # older commit with workflow differences requires Workflows: write,
          # which GITHUB_TOKEN cannot receive.
          python3 scripts/verify_release_commit.py \
            --repository "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$title" --notes-file release-notes.md "${args[@]}" "${assets[@]}"
