name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check when called by the release workflow.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tooling:
    name: Formatting and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: ./.github/actions/setup-dist
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate workflows
        run: actionlint -color
      - name: Validate release configuration
        run: dist plan --output-format=json > /dev/null

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Prepare filesystem fixtures
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).parent / "file-tidy-fixtures"
          root.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"FILE_TIDY_TEST_ROOT={root.resolve()}\n")
          PY
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: |
          # Windows fixtures share ancestors whose metadata is revalidated.
          # Keep fixture mutations separate; scanner worker threads stay enabled.
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUST_TEST_THREADS=1
          fi
          cargo test --workspace --locked
      - name: Run authorized filesystem tests
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).parent / "file-tidy-fixtures"
          root.mkdir(exist_ok=True)
          environment = dict(os.environ, FILE_TIDY_TEST_ROOT=str(root.resolve()))
          if environment.get("RUNNER_OS") == "Windows":
              environment["RUST_TEST_THREADS"] = "1"
          subprocess.run([
              "cargo", "test", "--workspace", "--locked",
              "--test", "authorization_plan", "--test", "plan_cli",
              "--test", "execution", "--test", "rename", "--test", "case_rename",
              "--", "--include-ignored",
          ], env=environment, check=True)
          subprocess.run([
              "cargo", "test", "--workspace", "--locked", "--lib",
              "--", "--include-ignored",
          ], env=environment, check=True)
          PY
      - name: Build release CLI
        run: cargo build --release --locked -p file-tidy-cli
      - name: Smoke test CLI
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: ./target/release/file-tidy"$EXE_SUFFIX" --help
